name: WhatsApp gateway validation

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: npm run check
      - name: Unit regression tests
        run: npm test
